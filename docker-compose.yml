name: cloakroom

services:
  # Users pull the published image (`cloakroom start` does). Developers build it
  # locally with CLOAKROOM_DEV=1 cloakroom start, which uses the two build
  # sections below; CLOAKBROWSER_SOURCE points the base at a local checkout.
  #
  # Base image only: never started. CloakBrowser from the jonclegg fork, which adds
  # a persistent default seed, process limits, GeoIP without a proxy, coherent
  # window geometry and hardware, and native X11 input. Built without the
  # browser binary, which the container downloads from CloakHQ on first start.
  cloakbrowser:
    build:
      context: ${CLOAKBROWSER_SOURCE:-https://github.com/jonclegg/CloakBrowser.git#cloakroom-fixes}
      args:
        PREFETCH_BINARY: "false"
    image: cloakroom-cloakbrowser:local
    entrypoint: ["true"]
    restart: "no"

  cloakroom:
    build:
      context: ./image
      additional_contexts:
        agent: ./agent
        examples: ./examples
        cloakbrowser: service:cloakbrowser
    image: ${CLOAKROOM_IMAGE:-ghcr.io/jonclegg/cloakroom:latest}
    pull_policy: missing
    container_name: cloakroom
    hostname: cloakroom
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-America/Chicago}
      CLOAKROOM_HOST_DATA_DIR: ${CLOAKROOM_DATA_DIR:-${HOME}/.cloakroom/data}
      CLOAKROOM_API_HOST_PORT: ${CLOAKROOM_API_PORT:-8423}
    ports:
      # Localhost only. Anyone who can reach these ports controls the browser.
      - "127.0.0.1:${CLOAKROOM_CDP_PORT:-9222}:9222"
      - "127.0.0.1:${CLOAKROOM_VIEWER_PORT:-6080}:6080"
      - "127.0.0.1:${CLOAKROOM_API_PORT:-8423}:8423"
    # Chromium crashes tabs with Docker's default 64 MB /dev/shm.
    shm_size: 2gb
    volumes:
      - profile:/profile
      - binary-cache:/root/.cloakbrowser
      # Notes, run logs, saved photos, the API token. A host folder, so callers
      # can open the files directly.
      - ${CLOAKROOM_DATA_DIR:-${HOME}/.cloakroom/data}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:9222/json/version && curl -fsS -o /dev/null http://localhost:8423/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads the browser from CloakHQ.
      start_period: 300s

  hello:
    image: ${CLOAKROOM_IMAGE:-ghcr.io/jonclegg/cloakroom:latest}
    pull_policy: missing
    profiles: ["examples"]
    depends_on:
      cloakroom:
        condition: service_healthy
    environment:
      CDP_URL: http://cloakroom:9222
    volumes:
      - ./examples:/examples:ro
    entrypoint: ["python", "-u", "/examples/hello.py"]

volumes:
  profile:
  binary-cache:
