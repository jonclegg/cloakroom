# Build Cloakroom from this folder instead of pulling it:
#   CLOAKROOM_DEV=1 cloakroom start
# start.sh adds this file to COMPOSE_FILE for that run. CLOAKBROWSER_SOURCE points
# the base at a local checkout of the fork instead of its GitHub branch.
services:
  # Base image only: never started. CloakBrowser from the jonclegg fork, for
  # cloakserve: the browser pool, a persistent default seed, process limits, GeoIP
  # without a proxy, and native X11 input. Built without CloakBrowser's binary;
  # the browser is the Fury core the cloakroom image installs.
  cloakbrowser:
    build:
      context: ${CLOAKBROWSER_SOURCE:-https://github.com/jonclegg/CloakBrowser.git#cloakroom-fixes}
      args:
        PREFETCH_BINARY: "false"
    image: cloakroom-cloakbrowser:local
    entrypoint: ["true"]
    restart: "no"

  cloakroom:
    build:
      context: ./image
      # FURY_CORE_URL, when set, builds against cores that are not released yet,
      # e.g. a local `python3 -m http.server` over the fork's dist/ folder.
      args:
        - FURY_CORE_URL
      additional_contexts:
        agent: ./agent
        examples: ./examples
        cloakbrowser: service:cloakbrowser
    image: ${CLOAKROOM_IMAGE:-cloakroom:dev}
